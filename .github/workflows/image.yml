name: image

# Builds the container and publishes it to the GitHub registry, so the NAS
# pulls a finished image instead of compiling anything.  Emacs 31.1 is
# built from source here, where it costs a few minutes on a four-core
# runner rather than half an hour on a NAS.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  EMACS_SOURCE: "31.1"

jobs:
  publish:
    name: build, test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Name and tag it
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Built and kept locally first, so a broken image is never published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: EMACS_SOURCE=${{ env.EMACS_SOURCE }}
          load: true
          tags: revere:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emacs is the one we asked for
        run: |
          docker run --rm --entrypoint emacs revere:candidate --version | head -1
          docker run --rm --entrypoint emacs revere:candidate --batch \
            --eval '(unless (string-prefix-p "${{ env.EMACS_SOURCE }}" emacs-version) (kill-emacs 1))'

      # The test suite is not in the image, so mount it and run it against
      # the code that is.
      - name: The suite, in the image that will ship
        run: |
          docker run --rm --entrypoint emacs \
            -v "$PWD/test:/test:ro" revere:candidate \
            -Q --batch -L /opt/revere/lisp -L /test \
            -l revere-tests -f ert-run-tests-batch-and-exit

      - name: The daemon starts and answers
        run: |
          docker run -d --name smoke \
            -e REVERE_BASE_URL=http://localhost:4000 \
            revere:candidate
          for i in $(seq 1 30); do
            if docker exec smoke emacsclient -s /run/revere/revere \
                 -e '(length revere-job-list)' >/dev/null 2>&1; then
              echo "daemon answered after ${i}s"
              docker exec smoke emacsclient -s /run/revere/revere \
                -e '(list emacs-version revere-model revere-directory (length (revere-skills-index)))'
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "the daemon never answered; its log:"
          docker logs smoke
          docker rm -f smoke
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything is cached from the build above, so this only pushes.
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: EMACS_SOURCE=${{ env.EMACS_SOURCE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
