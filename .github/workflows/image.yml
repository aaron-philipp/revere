name: image

# Builds the container and publishes it to the GitHub registry, so the NAS
# pulls a finished image instead of compiling anything.  Emacs 31.1 is
# built from source here, where it costs a few minutes on a four-core
# runner rather than half an hour on a NAS.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  EMACS_SOURCE: "31.1"

jobs:
  publish:
    name: build, test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Name and tag it
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Built and kept locally first, so a broken image is never published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: EMACS_SOURCE=${{ env.EMACS_SOURCE }}
          load: true
          tags: revere:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emacs is the one we asked for
        run: |
          docker run --rm --entrypoint emacs revere:candidate --version | head -1
          docker run --rm --entrypoint emacs revere:candidate --batch \
            --eval '(unless (string-prefix-p "${{ env.EMACS_SOURCE }}" emacs-version) (kill-emacs 1))'

      # The test suite is not in the image, so mount it and run it against
      # the code that is.
      - name: The suite, in the image that will ship
        run: |
          docker run --rm --entrypoint emacs \
            -v "$PWD/test:/test:ro" revere:candidate \
            -Q --batch -L /opt/revere/lisp -L /test \
            -l revere-tests -f ert-run-tests-batch-and-exit

      - name: The daemon starts and answers
        run: |
          docker run -d --name smoke \
            -e REVERE_BASE_URL=http://localhost:4000 \
            revere:candidate
          for i in $(seq 1 30); do
            if docker exec smoke emacsclient -s /run/revere/revere \
                 -e '(length revere-job-list)' >/dev/null 2>&1; then
              echo "daemon answered after ${i}s"
              docker exec smoke emacsclient -s /run/revere/revere \
                -e '(list emacs-version revere-model revere-directory (length (revere-skills-index)))'
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "the daemon never answered; its log:"
          docker logs smoke
          docker rm -f smoke
          exit 1

      # Mutual TLS, proven the way it is actually used: a real Emacs
      # running revere-client against the daemon through stunnel.
      - name: TLS admits the certificate holder and no one else
        run: |
          set -eux
          bash docker/make-certs.sh localhost 127.0.0.1
          docker run -d --name tls -p 9999:9999             -e REVERE_SERVER_TCP=1 -e REVERE_TLS=1             -v "$PWD/certs:/certs:ro"             -v "$PWD/config:/config"             revere:candidate
          ready=""
          for i in $(seq 1 30); do
            if docker exec tls test -f /config/server/revere 2>/dev/null; then
              ready=yes; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "the TLS container never wrote its server file; its log:"
            docker logs tls || true; docker rm -f tls || true; exit 1
          fi
          sudo chmod -R a+rX config

          echo "--- the proxy must be running, not merely configured"
          docker exec tls pgrep -f stunnel >/dev/null             || { echo "FAIL: stunnel is not running"; docker logs tls; docker rm -f tls; exit 1; }

          echo "--- and presenting a certificate we trust"
          if ! openssl s_client -connect 127.0.0.1:9999 -CAfile certs/ca.pem                  -cert certs/client.pem -key certs/client-key.pem                  </dev/null 2>&1 | tee openssl.log | grep -q "Verify return code: 0"; then
            echo "FAIL: could not verify the daemon against our authority"
            tail -30 openssl.log; docker logs tls; docker rm -f tls; exit 1
          fi

          # The real tests are at the application layer.  Under TLS 1.3 a
          # client with no certificate still sees a clean handshake and is
          # only rejected afterwards, so the handshake proves nothing.
          echo "--- the certificate holder gets an answer"
          docker run --rm --network host --entrypoint emacs             -v "$PWD/certs:/certs:ro" -v "$PWD/config:/config:ro"             revere:candidate -Q --batch -L /opt/revere/lisp             --eval '(progn
                      (require (quote revere-client))
                      (setq revere-client-auth-dir "/config/server/"
                            revere-client-tls t
                            revere-client-host "127.0.0.1"
                            revere-client-port 9999
                            revere-client-ca "/certs/ca.pem"
                            revere-client-certificate
                              (list "/certs/client-key.pem" "/certs/client.pem"))
                      (let ((answer (revere-client-eval (quote (list emacs-version (length revere-job-list))))))
                        (message "answered over TLS: %S" answer)
                        (unless (consp answer) (kill-emacs 1))))'             || { echo "FAIL: the certificate holder was not served";                  docker logs tls; docker rm -f tls; exit 1; }

          echo "--- without a certificate, nothing"
          docker run --rm --network host --entrypoint emacs             -v "$PWD/certs:/certs:ro" -v "$PWD/config:/config:ro"             revere:candidate -Q --batch -L /opt/revere/lisp             --eval '(progn
                      (require (quote revere-client))
                      (setq revere-client-auth-dir "/config/server/"
                            revere-client-tls t
                            revere-client-host "127.0.0.1"
                            revere-client-port 9999
                            revere-client-ca "/certs/ca.pem"
                            revere-client-certificate nil
                            revere-client-timeout 10)
                      (condition-case nil
                          (progn (revere-client-eval (quote (length revere-job-list)))
                                 (message "FAIL: served a client with no certificate")
                                 (kill-emacs 1))
                        (error (message "refused, as it should be"))))'             || { echo "FAIL: a client with no certificate got through";                  docker logs tls; docker rm -f tls; exit 1; }

          echo "--- several certificate holders at once"
          pids=""
          for n in 1 2 3 4 5 6; do
            docker run --rm --network host --entrypoint emacs -e "N=$n"               -v "$PWD/certs:/certs:ro" -v "$PWD/config:/config:ro"               revere:candidate -Q --batch -L /opt/revere/lisp               --eval '(progn
                        (require (quote revere-client))
                        (setq revere-client-auth-dir "/config/server/"
                              revere-client-tls t
                              revere-client-host "127.0.0.1"
                              revere-client-port 9999
                              revere-client-ca "/certs/ca.pem"
                              revere-client-certificate
                                (list "/certs/client-key.pem" "/certs/client.pem"))
                        (let* ((mine (string-to-number (getenv "N")))
                               (answer (revere-client-eval (list (quote list) mine (quote (emacs-pid))))))
                          (message "client %d got %S" mine answer)
                          (unless (equal (car answer) mine) (kill-emacs 1))))' &
            pids="$pids $!"
          done
          failed=0
          for p in $pids; do wait "$p" || failed=1; done
          if [ "$failed" != "0" ]; then
            echo "FAIL: concurrent clients were not all served"
            docker logs tls; docker rm -f tls; exit 1
          fi
          echo "all six were served, each its own answer"

          docker logs tls | tail -20
          docker rm -f tls

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything is cached from the build above, so this only pushes.
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: EMACS_SOURCE=${{ env.EMACS_SOURCE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
