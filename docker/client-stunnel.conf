# TLS on your side of the wire, so the Emacs you work in can reach a daemon
# that demands a certificate.
#
# emacsclient has no TLS of its own, which is why this exists: it listens on
# your loopback, speaks plain TCP to Emacs, and carries the encrypted leg to
# the NAS itself.  With it running, everything works the same as a daemon on
# your own machine, frames included.
#
#   Linux, macOS:  stunnel ~/revere/client-stunnel.conf
#   Windows:       install stunnel, put this in its config folder
#
# Change connect to your NAS, and the three file paths to where you keep the
# certificates.  The accept port is 9998 on purpose: that is the port the
# daemon records in its server file, so emacsclient and revere-client find
# this proxy without being told anything extra.

foreground = yes
pid =
syslog = no

[revere]
client = yes
accept = 127.0.0.1:9998
connect = nas.lan:9999

cert = /home/you/revere/client.pem
key = /home/you/revere/client-key.pem
CAfile = /home/you/revere/ca.pem
verifyChain = yes
sslVersionMin = TLSv1.2
