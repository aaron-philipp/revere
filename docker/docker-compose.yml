# Revere as a Synology Container Manager project.
#
# Put this file in /volume1/docker/revere, then Container Manager >
# Project > Create and point it at that folder.  It pulls the image built
# by GitHub Actions, so the NAS compiles nothing.  Read docker/README.md;
# the lines you must change are marked EDIT.
services:
  revere:
    container_name: revere
    image: ghcr.io/aaron-philipp/revere:latest

    # To build it here instead of pulling, comment out image above and
    # uncomment this.  Container Manager wants the whole repository in the
    # project folder for that, and EMACS_SOURCE compiles Emacs 31 in the
    # container, which is slow on NAS hardware.
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    #   args:
    #     EMACS_SOURCE: "31.1"
    #     WITH_NODE: "false"
    #     WITH_PYTHON: "false"

    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      # EDIT: your NAS timezone, or routines fire at the wrong hour.
      TZ: America/Chicago

      # EDIT: the DSM user that owns the folders below.  The first DSM
      # account is usually 1026 and the users group is 100; check over SSH
      # with `id yourname`.
      PUID: "1026"
      PGID: "100"

      # EDIT: your OpenAI-compatible endpoint, reachable from the NAS.
      REVERE_BASE_URL: "http://litellm.lan:4000"
      REVERE_MODEL: "qwen-3.8"

      # The Emacs server on TCP, which is what the port below is for.  Set
      # it to 0 if you will only ever attach from a shell on the NAS.
      REVERE_SERVER_TCP: "1"
      REVERE_SERVER_PORT: "9999"
      # The address written into config/server/revere, which is what a
      # client dials.  127.0.0.1 suits the loopback binding below, reached
      # over an SSH tunnel.  Put the NAS's own address here if you publish
      # the port to the network instead.
      REVERE_SERVER_ADVERTISE: "127.0.0.1"

      # Who the unattended commits come from.
      GIT_AUTHOR_NAME: "Revere"
      GIT_AUTHOR_EMAIL: "revere@localhost"

      # Discord: put the token in config/authinfo, not here.
      # REVERE_DISCORD_CHANNELS: "123456789012345678"
      # REVERE_DISCORD_USERS: "987654321098765432"
      # REVERE_DISCORD: "off"

    ports:
      # The Emacs server, so the Emacs you already use can drive this
      # daemon with revere-client.
      #
      # Bound to the NAS's loopback, so it is reached over an SSH tunnel:
      #   ssh -L 9999:127.0.0.1:9999 you@nas
      # Emacs authenticates with a 64-character key sent in the clear and
      # grants whoever presents it arbitrary Lisp, which is a shell on your
      # NAS.  The tunnel is what encrypts that key and puts your SSH
      # credentials in front of it.
      - "127.0.0.1:9999:9999"
      # To reach it from the network directly instead, with the key
      # crossing your LAN in the clear, use this and set
      # REVERE_SERVER_ADVERTISE to the NAS's address.
      # - "9999:9999"

    volumes:
      # DSM keeps container config and data under /volume1/docker.
      #
      # What you set: local.el, authinfo, prompt.md, your own skills.
      - /volume1/docker/revere/config:/config
      # What it writes: logbook, routines, check-in, board, memory, and the
      # worktrees of unattended jobs.  This is the one to back up.
      - /volume1/docker/revere/data:/data
      # MCP and ACP servers that are not in the image, plus their caches.
      - /volume1/docker/revere/servers:/servers
      # EDIT: the projects it works on, wherever your code lives.  Append
      # :ro to try it out read-only before you let it edit anything.
      - /volume1/code:/work

# A share on another machine, rather than folders on this NAS.  Replace the
# bind mounts above with named volumes like this one, and set uid and gid
# to the same numbers as PUID and PGID: ownership on an SMB mount comes
# from these options, and nothing in the container can chown it afterwards.
#
# volumes:
#   revere-data:
#     driver: local
#     driver_opts:
#       type: cifs
#       o: "username=revere,password=SECRET,uid=1026,gid=100,file_mode=0664,dir_mode=0775,vers=3.0"
#       device: "//fileserver/revere/data"
#
# Unattended jobs run git in worktrees under the data volume, and git over
# SMB is slow and locks badly.  With data on a remote share, either keep
# that volume local and share only config, or set
# REVERE_UNATTENDED_MODE: buffers and review in the chat instead.
